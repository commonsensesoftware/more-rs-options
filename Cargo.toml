[package]
name = "more-options"
version = "4.0.0"
edition = "2021"
rust-version = "1.79"
authors = ["Chris Martinez <chris.s.martinez@hotmail.com>"]
description = "Provides support for options"
keywords = ["more", "options"]
license = "MIT"
readme = "README.md"
homepage = "https://commonsensesoftware.github.io/more-rs-options/"
repository = "https://github.com/commonsensesoftware/more-rs-options"

# RUSTDOCFLAGS="--cfg docsrs"; cargo +nightly doc
[package.metadata.docs.rs]
features = ["di", "cfg"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "options"
path = "src/lib.rs"
doctest = false

[features]
di = ["dep:more-di"]
cfg = ["di", "dep:more-config", "dep:serde"]
async = ["more-di?/async", "dep:maybe-impl"]

[workspace.dependencies]
serde = "1.0"
more-config = { version = "3.0.0", default-features = false, path = "C:\\dev\\rust\\more-rs-config" }

[dependencies]
cfg-if = "1.0"
maybe-impl = { version = "0.1.0", optional = true }
more-changetoken = "2.1.0"
serde = { workspace = true, optional = true }

[dependencies.more-di]
version = "3.2.0"
optional = true

[dependencies.more-config]
workspace = true
features = ["binder"]
optional = true

[dev-dependencies]
more-config = { workspace = true, features = ["binder", "mem", "json"] }
more-options = { path = ".", features = ["cfg"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
tempfile = "3.6.0"
test-case = "3.3.1"
